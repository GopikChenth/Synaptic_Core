<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Synapse Core System Architecture</title>
  <desc id="arch-desc">Layered architecture diagram from Compose UI down to QUIC transport.</desc>

  <defs>
    <linearGradient id="arch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A14"/>
      <stop offset="100%" stop-color="#0E1626"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="20" fill="url(#arch-bg)"/>
  <rect width="1198" height="358" x="1" y="1" rx="19" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Top Header -->
  <g transform="translate(60, 32)">
    <rect width="190" height="24" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="95" y="16" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">SYSTEM ARCHITECTURE</text>
    <text x="205" y="18" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">Native Backend Engine &amp; Control Plane</text>
  </g>

  <!-- Horizontal Layer Cards -->
  <g transform="translate(60, 78)">
    <!-- Layer 1: Client Layer -->
    <g transform="translate(0, 0)">
      <rect width="1080" height="48" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="24" y="30" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="12" font-weight="700">CLIENT LAYER</text>
      <g transform="translate(180, 10)">
        <rect width="180" height="28" rx="6" fill="#1E293B"/>
        <text x="90" y="19" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Compose Desktop (PC)</text>
      </g>
      <g transform="translate(375, 10)">
        <rect width="190" height="28" rx="6" fill="#1E293B"/>
        <text x="95" y="19" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Compose Android (Mobile)</text>
      </g>
      <g transform="translate(580, 10)">
        <rect width="170" height="28" rx="6" fill="#1E293B"/>
        <text x="85" y="19" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Web Dashboard / CLI</text>
      </g>
      <text x="1055" y="30" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="11" text-anchor="end">HTTP / WS IPC</text>
    </g>

    <!-- Layer 2: Local Control Plane -->
    <g transform="translate(0, 60)">
      <rect width="1080" height="52" rx="10" fill="#0E2238" stroke="#0284C7" stroke-width="1.2"/>
      <text x="24" y="32" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="12" font-weight="700">CONTROL PLANE</text>
      <text x="180" y="32" fill="#BAE6FD" font-family="ui-monospace, monospace" font-size="11.5">
        Axum Embedded Server (127.0.0.1:9090)  •  /api/v1/system  •  /api/v1/folders  •  /api/v1/conflicts  •  WS /api/v1/events
      </text>
    </g>

    <!-- Layer 3: Core Engines (3 columns) -->
    <g transform="translate(0, 124)">
      <!-- Col 1: Storage & Chunker -->
      <g transform="translate(0, 0)">
        <rect width="345" height="68" rx="10" fill="#0C1B2A" stroke="#1E3A5F" stroke-width="1"/>
        <text x="16" y="26" fill="#60A5FA" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Content Storage &amp; CAS</text>
        <text x="16" y="48" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11">FastCDC (64K-2M) • BLAKE3 Hashing • SQLite WAL</text>
      </g>

      <!-- Col 2: Merkle DAG -->
      <g transform="translate(365, 0)">
        <rect width="350" height="68" rx="10" fill="#1C132E" stroke="#4C1D95" stroke-width="1"/>
        <text x="16" y="26" fill="#C084FC" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Merkle Revision DAG</text>
        <text x="16" y="48" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11">Causality Graph • BFS LCA Resolver • 2-Parent Commits</text>
      </g>

      <!-- Col 3: Conflict Engine -->
      <g transform="translate(735, 0)">
        <rect width="345" height="68" rx="10" fill="#062820" stroke="#065F46" stroke-width="1"/>
        <text x="16" y="26" fill="#34D399" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Multi-Strategy Conflict Pipeline</text>
        <text x="16" y="48" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11">Tier 1: diff3 • Tier 2: Quarantine • Tier 3: Visual Merge</text>
      </g>
    </g>

    <!-- Layer 4: Networking & Transport -->
    <g transform="translate(0, 204)">
      <rect width="1080" height="52" rx="10" fill="#1E162A" stroke="#7C3AED" stroke-width="1"/>
      <text x="24" y="32" fill="#C084FC" font-family="ui-monospace, monospace" font-size="12" font-weight="700">P2P TRANSPORT</text>
      <text x="180" y="32" fill="#E9D5FF" font-family="ui-monospace, monospace" font-size="11.5">
        Quinn QUIC Transport (UDP :9190)  •  TLS 1.3  •  Ed25519 Device Keys  •  Local Discovery Broadcast (UDP :21027)
      </text>
    </g>
  </g>
</svg>
