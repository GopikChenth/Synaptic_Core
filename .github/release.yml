# Categories for GitHub's auto-generated release notes, based on PR labels.
changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - github-actions[bot]
      - dependabot[bot]
  categories:
    - title: Breaking changes
      labels:
        - breaking
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Android
      labels:
        - android
    - title: API
      labels:
        - api
    - title: CI, build and tooling
      labels:
        - ci
        - build
        - dependencies
    - title: Other changes
      labels:
        - "*"
