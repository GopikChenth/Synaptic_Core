# =============================================================================
# Prepare Release: one click in the Actions tab cuts a release.
#
#   Actions → Prepare Release → Run workflow → version: 1.1.0
#
#   1. validates the version (semver, newer than Cargo.toml, tag not taken)
#   2. bumps Cargo.toml + Cargo.lock, commits "chore(release): vX.Y.Z", tags vX.Y.Z
#   3. pushes commit + tag atomically
#   4. starts the Release Pipeline on the tag, which builds, tests on every
#      platform (incl. Android emulators) and publishes the GitHub Release
#
# Tags pushed with GITHUB_TOKEN don't trigger other workflows, so step 4 dispatches
# the Release Pipeline explicitly (workflow_dispatch is the documented exception).
#
# Branch protection on the default branch: either allow GitHub Actions to push, or
# add a fine-grained PAT (contents: write) as the RELEASE_TOKEN secret. With
# RELEASE_TOKEN the tag push itself triggers the Release Pipeline, so step 4 is skipped.
# =============================================================================
name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without 'v' (e.g. 1.1.0 or 1.2.0-beta.1)"
        required: true
        type: string
      dry_run:
        description: "Validate and show what would happen, but don't push"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Bump, tag and dispatch v${{ inputs.version }}
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
    steps:
      - name: Require the default branch
        if: github.ref_name != github.event.repository.default_branch
        run: |
          echo "::error::Run Prepare Release from '${{ github.event.repository.default_branch }}' (got '${{ github.ref_name }}')."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed to detect an existing release
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          new="${VERSION#v}"
          if ! [[ "${new}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'${VERSION}' is not a semantic version (expected e.g. 1.2.3 or 1.2.3-beta.1)."
            exit 1
          fi
          cur="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="synapse-core") | .version')"
          echo "Current version: ${cur}"
          echo "Requested:       ${new}"
          if [[ "${new}" == "${cur}" ]]; then
            echo "::error::Cargo.toml is already at ${cur}. Pick a newer version."
            exit 1
          fi
          # Compare release cores (X.Y.Z). Same core is only fine when moving along or out
          # of a pre-release (1.1.0-beta.1 -> 1.1.0-beta.2 / 1.1.0), never back into one.
          if [[ "$(printf '%s\n%s\n' "${cur%%-*}" "${new%%-*}" | sort -V | tail -n1)" != "${new%%-*}" ]] \
             || { [[ "${cur%%-*}" == "${new%%-*}" ]] && [[ "${cur}" != *-* ]]; }; then
            echo "::error::${new} is not newer than the current version ${cur}."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v${new}" >/dev/null; then
            echo "::error::Tag v${new} already exists."
            exit 1
          fi
          echo "NEW_VERSION=${new}" >> "$GITHUB_ENV"

      - name: Bump version, commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/bump-version.sh "${NEW_VERSION}"
          git show --stat HEAD

      - name: Push commit and tag
        if: ${{ !inputs.dry_run }}
        run: git push --atomic origin "HEAD:${GITHUB_REF_NAME}" "v${NEW_VERSION}"

      - name: Start Release Pipeline on the tag
        if: ${{ !inputs.dry_run && env.HAS_RELEASE_TOKEN != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref "v${NEW_VERSION}"

      - name: Summary
        run: |
          {
            if [[ "${{ inputs.dry_run }}" == "true" ]]; then
              echo "### Dry run: v${NEW_VERSION} validated, nothing pushed"
            else
              echo "### v${NEW_VERSION} tagged"
              echo
              echo "The **Release Pipeline** is now building and testing every platform."
              echo "Follow it in [Actions](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/release.yml);"
              echo "the release appears at [Releases](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/v${NEW_VERSION}) when it finishes."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
